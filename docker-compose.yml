services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
    healthcheck:
      test: echo ruok | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  cassandra:
    image: cassandra:4.1.11
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: consumer-lending-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e \"DESCRIBE CLUSTER\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  cassandra-init:
    image: cassandra:4.1.11
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/bash
      - -ec
      - |
        echo "Waiting for Cassandra CQL on cassandra:9042..."
        until cqlsh cassandra 9042 -e "DESCRIBE CLUSTER" >/dev/null 2>&1; do
          sleep 2
        done
        echo "Creating keyspace lending if missing..."
        cqlsh cassandra 9042 -e "CREATE KEYSPACE IF NOT EXISTS lending WITH replication = {'class':'SimpleStrategy','replication_factor':1};"
        echo "Cassandra keyspace initialization complete."

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_CASSANDRA_PORT: 9042
      SPRING_CASSANDRA_KEYSPACE_NAME: lending
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      API_LOAN_BASE_PATH: /api/consumer-loans
      API_LOAN_SUBMIT_LOAN_PROPOSITIONS_PATH: /propositions/submit-option
      #API_LOAN_GET_LOAN_PROPOSITIONS_PATH: /propositions/get-options
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "localhost,127.0.0.1,host.docker.internal,prometheus,grafana,backend,kafka,zookeeper,cassandra"
      http_proxy: ""
      https_proxy: ""
      no_proxy: "localhost,127.0.0.1,host.docker.internal,prometheus,grafana,backend,kafka,zookeeper,cassandra"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "localhost,127.0.0.1,host.docker.internal,prometheus,grafana,backend,kafka,zookeeper,cassandra"
      http_proxy: ""
      https_proxy: ""
      no_proxy: "localhost,127.0.0.1,host.docker.internal,prometheus,grafana,backend,kafka,zookeeper,cassandra"
    volumes:
      - ./resources/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "localhost,127.0.0.1,host.docker.internal,prometheus,grafana,backend,kafka,zookeeper,cassandra"
      http_proxy: ""
      https_proxy: ""
      no_proxy: "localhost,127.0.0.1,host.docker.internal,prometheus,grafana,backend,kafka,zookeeper,cassandra"
    volumes:
      - ./resources/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8080

  startup-banner:
    image: alpine:3.20
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      grafana:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        echo "=================================================="
        echo "Consumer Lending Platform is up"
        echo "Frontend    : http://localhost:3000"
        echo "Backend     : http://localhost:8080"
        echo "Grafana     : http://localhost:3001 (admin/admin)"
        echo "Prometheus  : http://localhost:9090"
        echo "=================================================="
    restart: "no"

volumes:
  cassandra_data: